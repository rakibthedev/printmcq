<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCQ Word Style Pagination</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<style>
    /* --- BASIC RESET --- */
    * { box-sizing: border-box; }
    body {
        font-family: 'Noto Serif Bengali', serif;
        font-size: 13px; /* Adjusted for better fit */
        margin: 0;
        background: #525659; /* App-like background */
        height: 100vh;
        overflow: hidden; 
    }

    /* --- SIDEBAR --- */
    #sidebar {
        width: 200px;
        background: #f1f3f4;
        border-right: 1px solid #ccc;
        height: 100vh;
        position: fixed;
        top: 0; left: 0;
        padding: 15px;
        z-index: 100;
        overflow-y: auto;
    }
    .json-btn {
        width: 100%; padding: 10px; margin-bottom: 5px;
        border: 1px solid #ccc; background: #fff; cursor: pointer;
        text-align: left; border-radius: 4px;
    }
    .json-btn.active { background: #333; color: #fff; }

    /* --- MAIN VIEWPORT --- */
    #content-viewport {
        margin-left: 200px;
        height: 100vh;
        overflow: auto; /* Allow scrolling pages */
        padding: 30px;
        display: flex;
        flex-direction: column;
        align-items: center; /* Center pages */
        gap: 20px; /* Space between pages */
    }

    /* --- THE A4 PAGE --- */
    .page {
        width: 210mm;
        height: 297mm;
        background: white;
        padding: 20px; /* Page Margin */
        box-shadow: 0 0 10px rgba(0,0,0,0.5);
        position: relative;
        overflow: hidden; /* Hides content while calculating */
        flex-shrink: 0;
    }

    /* --- COLUMNS INSIDE PAGE --- */
    .page-content {
        height: 100%;
        column-count: 2;
        column-gap: 30px; 
        column-fill: auto; /* Fill col 1 completely before moving to col 2 */
        column-rule: 1px solid #eee; /* Optional: line between columns */
    }

    /* --- MCQ ITEM STYLING --- */
    .mcq {
        break-inside: avoid; /* Prevent splitting a question between cols */
        page-break-inside: avoid;
        margin-bottom: 12px;
        font-size: 12px;
        border-bottom: 1px dashed #eee; /* Optional separator */
        padding-bottom: 5px;
    }

    .question-row {
        display: flex;
        justify-content: space-between;
        font-weight: bold;
        margin-bottom: 4px;
    }

    .ans-circle {
        border: 1px solid #000;
        width: 16px; height: 16px;
        border-radius: 50%;
        text-align: center;
        line-height: 14px;
        font-size: 10px;
        flex-shrink: 0;
        margin-left: 5px;
    }

    /* --- 4 OPTIONS PER LINE --- */
    .options-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr); /* Exactly 4 columns */
        gap: 5px;
        margin-top: 2px;
    }
    
    .opt {
        font-size: 11px;
        white-space: nowrap; /* Force single line */
        overflow: hidden;
        text-overflow: ellipsis; /* Add ... if text too long */
    }

    /* HEADER (Only on first page) */
    .doc-header {
        text-align: center;
        margin-bottom: 15px;
        padding-bottom: 5px;
        border-bottom: 2px solid #333;
        column-span: all; /* Spans across both columns */
    }

    /* --- PRINT SETTINGS --- */
    @media print {
        body, #content-viewport { 
            background: white; 
            margin: 0; 
            padding: 0; 
            height: auto; 
            overflow: visible; 
            display: block; 
        }
        #sidebar, .json-btn, button { display: none !important; }
        
        .page {
            box-shadow: none;
            margin: 0;
            page-break-after: always; /* Force new paper for every div */
            height: 297mm; /* Ensure height is fixed for column flow */
            overflow: hidden;
        }
        
        /* Remove margin from last page to avoid blank sheet */
        .page:last-child { page-break-after: auto; }
    }
    
    /* MOBILE TOGGLE */
    #toggle-menu { display: none; position: fixed; top: 10px; left: 10px; z-index: 200; }
    @media(max-width: 768px) {
        #sidebar { display: none; }
        #sidebar.show { display: block; }
        #content-viewport { margin-left: 0; padding: 10px; align-items: flex-start; }
        #toggle-menu { display: block; }
    }
</style>
</head>
<body>

<button id="toggle-menu" onclick="document.getElementById('sidebar').classList.toggle('show')">Menu</button>

<div id="sidebar">
    <h3 style="text-align:center">Question Bank</h3>
    </div>

<div id="content-viewport">
    </div>

<script>
    // --- DATA SOURCES ---
    const jsonMap = {
        "BCS Preliminary": "json/bcs_all.json",
        "Primary School": "json/bangla.json"
    };

    // --- LOGIC ---
    const viewport = document.getElementById('content-viewport');
    const sidebar = document.getElementById('sidebar');

    // 1. Initialize Sidebar
    Object.keys(jsonMap).forEach(key => {
        const btn = document.createElement('button');
        btn.className = 'json-btn';
        btn.textContent = key;
        btn.onclick = () => {
            document.querySelectorAll('.json-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadJSON(jsonMap[key]);
            if(window.innerWidth < 768) sidebar.classList.remove('show');
        };
        sidebar.appendChild(btn);
    });

    // 2. Load JSON
    function loadJSON(path) {
        viewport.innerHTML = "<p style='color:white; text-align:center'>Loading and paginating...</p>";
        
        fetch(path)
            .then(res => res.json())
            .then(data => {
                // We use a slight timeout to let the DOM refresh before heavy calculation
                setTimeout(() => paginateMCQs(data), 50);
            })
            .catch(err => alert("Error: " + err));
    }

    // 3. THE PAGINATION ENGINE
    function paginateMCQs(data) {
        viewport.innerHTML = ""; // Clear existing

        const letters = ['a','b','c','d'];

        // Helper to create a new blank page
        function createNewPage() {
            const page = document.createElement('div');
            page.className = 'page';
            const content = document.createElement('div');
            content.className = 'page-content';
            page.appendChild(content);
            viewport.appendChild(page);
            return content;
        }

        let currentPageContent = createNewPage();
        let headerAdded = false;

        // 3.1. Add Header (Only to the first page)
        if (data.length > 0 && data[0].header) {
            const headerDiv = document.createElement('div');
            headerDiv.className = 'doc-header';
            data[0].header.forEach(t => {
                const h = document.createElement('div');
                h.style.fontWeight = "bold"; h.style.fontSize="16px";
                h.textContent = t;
                headerDiv.appendChild(h);
            });
            currentPageContent.appendChild(headerDiv);
        }

        // 3.2. Loop through Questions
        for (let i = 1; i < data.length; i++) {
            const item = data[i];

            // Create MCQ Element
            const mcqDiv = document.createElement('div');
            mcqDiv.className = 'mcq';

            // Question Text Row
            const qRow = document.createElement('div');
            qRow.className = 'question-row';
            qRow.innerHTML = `<span>${i}. ${item.label}</span> <div class="ans-circle">${(item.answer||"").toUpperCase()}</div>`;
            mcqDiv.appendChild(qRow);

            // Options Grid (4 per line)
            if (item.options) {
                const optGrid = document.createElement('div');
                optGrid.className = 'options-grid';
                item.options.forEach((op, idx) => {
                    const sp = document.createElement('div');
                    sp.className = 'opt';
                    sp.innerHTML = `<b>${letters[idx]})</b> ${op}`;
                    optGrid.appendChild(sp);
                });
                mcqDiv.appendChild(optGrid);
            }

            // 3.3. APPEND & CHECK OVERFLOW
            // We append the question to the current page
            currentPageContent.appendChild(mcqDiv);

            // CHECK: Did adding this cause overflow?
            // scrollHeight > clientHeight means content is taller than the A4 page container
            if (currentPageContent.scrollHeight > currentPageContent.clientHeight) {
                
                // 1. Remove the item that caused overflow
                currentPageContent.removeChild(mcqDiv);
                
                // 2. Create a NEW Page
                currentPageContent = createNewPage();
                
                // 3. Add the item to the NEW page
                currentPageContent.appendChild(mcqDiv);
            }
        }

        // Re-render math
        if(window.MathJax) MathJax.typesetPromise();
    }

    // Auto load first
    if(sidebar.firstChild.nextSibling) sidebar.firstChild.nextSibling.click();

</script>
</body>
</html>
